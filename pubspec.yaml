name: flex
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  json_annotation: any
  freezed_annotation: any
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.10+1
  dio: ^5.4.3+1
  bloc: ^7.0.0
  flutter_bloc: ^7.0.0
  awesome_snackbar_content: ^0.1.3
  shared_preferences: ^2.2.3
  equatable: ^2.0.5
  carousel_slider: ^4.2.1
  flutter_animated_icons: ^1.0.1
  html_editor_enhanced: ^2.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable: any
  build_runner: any
  freezed: any
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/png/
  fonts:
    - family: anjoman
      fonts:

        - asset: assets/fonts/Anjoman-Regular.ttf
    - family: dana 
      fonts:
        - asset: assets/fonts/DANA-REGULAR.TTF